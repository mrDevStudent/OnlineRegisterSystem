<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyClient — Enrollment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12182B;
  --ink-2:#1C2440;
  --paper:#F6F1E3;
  --paper-2:#EEE6D1;
  --card:#FBF8EF;
  --gold:#B08A3E;
  --gold-light:#D5B171;
  --forest:#2F4B3C;
  --rose:#9B3A3A;
  --line:rgba(18,24,43,0.14);
  --ink-soft:rgba(18,24,43,0.62);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(18,24,43,0.035) 28px);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  padding-bottom:60px;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
.wrap{max-width:720px;margin:0 auto;padding:0 18px;}

/* ---- header ---- */
header.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:16px 0;
  border-bottom:3px solid var(--gold);
}
header.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.monogram{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold));
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;color:var(--ink);font-size:15px;
  flex-shrink:0;
}
.brand-text .name{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.1;}
.brand-text .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);}
.session-pill{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;
  border:1px solid rgba(213,177,113,0.5);
  color:var(--gold-light);
  padding:5px 10px;border-radius:20px;
  white-space:nowrap;
}

main{padding-top:28px;}

/* ---- ledger card ---- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:2px;
  padding:22px 20px;
  margin-bottom:16px;
  box-shadow:0 1px 0 var(--line);
  position:relative;
}
.card::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--gold);
  opacity:0;
  transition:opacity .15s;
}
.card.accent::before{opacity:1;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin:0 0 6px 0;
}
.card h2{font-size:21px;margin:0 0 4px 0;}
.card p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 16px 0;}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
  padding:12px 18px;border-radius:2px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--paper);
  cursor:pointer;text-decoration:none;
  width:100%;margin-bottom:10px;
  transition:transform .08s, background .15s;
}
.btn:active{transform:scale(0.98);}
.btn:hover{background:var(--ink-2);}
.btn.outline{background:transparent;color:var(--ink);border-color:var(--ink);}
.btn.outline:hover{background:rgba(18,24,43,0.06);}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);}
.btn.gold:hover{background:var(--gold-light);}
.btn.danger{background:var(--rose);border-color:var(--rose);color:#fff;}
.btn.danger:hover{opacity:.9;}
.btn.small{width:auto;padding:8px 14px;font-size:13px;margin-bottom:0;}
.btn.block-row{display:flex;gap:10px;}
.btn.block-row .btn{margin-bottom:0;}

/* ---- forms ---- */
label{display:block;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:14px 0 6px;}
label:first-of-type{margin-top:0;}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:12px 12px;border:1.5px solid var(--line);border-radius:2px;
  font-family:'Inter',sans-serif;font-size:15px;background:#fff;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
.checkline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);}
.checkline:last-child{border-bottom:none;}
.checkline input{width:18px;height:18px;}
.error-box{background:rgba(155,58,58,0.08);border:1px solid rgba(155,58,58,0.35);color:var(--rose);padding:10px 12px;border-radius:2px;font-size:13.5px;margin-bottom:14px;}
.help{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}

/* ---- module grid (dashboards) ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{
  background:var(--card);border:1.5px solid var(--line);border-radius:2px;
  padding:16px 12px;text-align:left;cursor:pointer;
  font-family:'Inter',sans-serif;
}
.tile:hover{border-color:var(--gold);}
.tile .icon{font-size:20px;display:block;margin-bottom:8px;}
.tile .t{font-weight:700;font-size:14px;line-height:1.25;}
.tile .d{font-size:12px;color:var(--ink-soft);margin-top:3px;}

/* ---- table ---- */
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px;}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);}
th{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
td.num{font-family:'IBM Plex Mono',monospace;}

/* ---- badge ---- */
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:600;}
.badge.pending{background:rgba(176,138,62,0.15);color:var(--gold);}
.badge.approved{background:rgba(47,75,60,0.15);color:var(--forest);}
.badge.declined{background:rgba(155,58,58,0.13);color:var(--rose);}

/* ---- slip / ID card ---- */
.slip{
  background:var(--card);
  border:1.5px dashed var(--gold);
  border-radius:4px;padding:24px 20px;position:relative;overflow:hidden;
  margin-bottom:16px;
}
.slip .stamp{
  position:absolute;top:18px;right:16px;
  border:2.5px solid var(--forest);color:var(--forest);
  font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;
  padding:6px 10px;border-radius:50%;transform:rotate(-12deg);
  opacity:.85;text-align:center;line-height:1.15;
}
.slip .ref{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);letter-spacing:.03em;}
.slip h3{margin:2px 0 14px 0;font-size:19px;}
.slip .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;}
.slip .row span:first-child{color:var(--ink-soft);}
.slip .row span:last-child{font-weight:600;text-align:right;}

/* ---- breadcrumb / back ---- */
.crumb{
  display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--ink-soft);
}
.crumb button{
  background:none;border:none;color:var(--ink);font-weight:600;cursor:pointer;padding:0;
  font-family:'Inter',sans-serif;font-size:13px;text-decoration:underline;
}

.landing-hero{text-align:center;padding:36px 0 8px;}
.landing-hero .monogram{width:56px;height:56px;font-size:21px;margin:0 auto 14px;}
.landing-hero h1{font-size:28px;margin:0 0 8px;}
.landing-hero p{color:var(--ink-soft);font-size:14.5px;max-width:440px;margin:0 auto 26px;}

.center-note{text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:18px;}
.divider{height:1px;background:var(--line);margin:18px 0;}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr;}}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12182B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="app"></div>

<script>
/* ===================== DATA LAYER ===================== */
let db = null;
let session = null;
let route = {page:'landing'};
let formError = '';
let draft = {};

function seedDB(){
  return {
    accounts:[{username:'admin', password:'admin123', role:'admin', displayName:'System Administrator'}],
    subjects:[
      {code:'MATH101', name:'College Algebra', units:3, prereq:'None'},
      {code:'ENG101', name:'Communication Arts', units:3, prereq:'None'},
      {code:'CS101', name:'Introduction to Computing', units:3, prereq:'None'},
      {code:'PE101', name:'Physical Education 1', units:2, prereq:'None'}
    ],
    admissions:[],
    students:[],
    enrollmentRequests:[],
    nextAdmRef:1000,
    nextStudentId:20001,
    nextReqId:1
  };
}

async function loadDB(){
  try{
    const raw = localStorage.getItem('myclient-db');
    if(!raw) throw new Error('no data yet');
    db = JSON.parse(raw);
  }catch(e){
    db = seedDB();
    await saveDB();
  }
}
async function saveDB(){
  try{ localStorage.setItem('myclient-db', JSON.stringify(db)); }
  catch(e){ console.error('save failed', e); }
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){ return '₱' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* ===================== NAV ===================== */
function nav(page, extra){
  route = Object.assign({page:page}, extra||{});
  formError='';
  render();
  window.scrollTo(0,0);
}

/* ===================== RENDER SHELL ===================== */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderHeader() + '<main><div class="wrap">' + renderPage() + '</div></main>';
}

function renderHeader(){
  let pill = '';
  if(session){
    pill = `<div class="session-pill">${esc(session.role.toUpperCase())} · ${esc(session.displayName)}</div>`;
  }
  return `
  <header class="topbar"><div class="wrap">
    <div class="brand">
      <div class="monogram">MC</div>
      <div class="brand-text"><div class="name">MyClient</div><div class="tag">Enrollment Registrar</div></div>
    </div>
    ${pill}
  </div></header>`;
}

function renderPage(){
  switch(route.page){
    case 'landing': return pageLanding();
    case 'login': return pageLogin();
    case 'admission': return pageAdmission();
    case 'admissionSlip': return pageAdmissionSlip();
    case 'admin': return pageAdminHub();
    case 'admin-studentReg': return pageAdminStudentReg();
    case 'admin-subjects': return pageAdminSubjects();
    case 'admin-payments': return pageAdminPayments();
    case 'admin-reports': return pageAdminReports();
    case 'admin-createAdmin': return pageAdminCreateAdmin();
    case 'admin-createStudent': return pageAdminCreateStudent();
    case 'admin-enrollment': return pageAdminEnrollment();
    case 'admin-logout': return pageConfirmLogout('admin');
    case 'student': return pageStudentHub();
    case 'student-enroll': return pageStudentEnroll();
    case 'student-schedule': return pageStudentSchedule();
    case 'student-payment': return pageStudentPayment();
    case 'student-status': return pageStudentStatus();
    case 'student-logout': return pageConfirmLogout('student');
    case 'loggedOut': return pageLoggedOut();
    default: return pageLanding();
  }
}

function crumb(label, onclickPage){
  return `<div class="crumb"><button onclick="nav('${onclickPage}')">&larr; ${esc(label)}</button></div>`;
}

/* ===================== LANDING ===================== */
function pageLanding(){
  return `
  <div class="landing-hero">
    <div class="monogram">MC</div>
    <h1>Welcome to the Registrar.</h1>
    <p>Log in to your account, or start a new admission if you're joining MyClient for the first time.</p>
  </div>
  <div class="card accent">
    <div class="eyebrow">Have an account?</div>
    <h2>Log In</h2>
    <p class="sub">For returning students and staff.</p>
    <button class="btn gold" onclick="nav('login')">Log In</button>
  </div>
  <div class="card">
    <div class="eyebrow">New here?</div>
    <h2>Student Admission</h2>
    <p class="sub">Apply on-site and receive a printable admission slip.</p>
    <button class="btn outline" onclick="draft={}; nav('admission')">Start Admission</button>
  </div>
  <p class="center-note">Admin demo login — username <b>admin</b>, password <b>admin123</b></p>
  `;
}

/* ===================== LOGIN ===================== */
function pageLogin(){
  return `
  ${crumb('Landing Page','landing')}
  <div class="card">
    <div class="eyebrow">Sign In</div>
    <h2>Log In</h2>
    ${formError? `<div class="error-box">${esc(formError)}</div>`:''}
    <form onsubmit="return doLogin(event)">
      <label>Username</label>
      <input type="text" id="lg-user" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="lg-pass" required autocomplete="current-password">
      <div style="margin-top:18px;">
        <button class="btn gold" type="submit">Enter</button>
      </div>
    </form>
  </div>
  `;
}
async function doLogin(e){
  e.preventDefault();
  const u = document.getElementById('lg-user').value.trim();
  const p = document.getElementById('lg-pass').value;
  const acc = db.accounts.find(a=>a.username.toLowerCase()===u.toLowerCase() && a.password===p);
  if(!acc){
    formError = 'Invalid username or password.';
    render();
    return false;
  }
  if(acc.role==='admin'){
    session = {role:'admin', username:acc.username, displayName:acc.displayName||acc.username};
    nav('admin');
  }else{
    const stu = db.students.find(s=>s.studentId===acc.studentId);
    session = {role:'student', username:acc.username, studentId:acc.studentId, displayName: stu? stu.name: acc.username};
    nav('student');
  }
  return false;
}

/* ===================== ADMISSION ===================== */
function pageAdmission(){
  const d = draft;
  return `
  ${crumb('Landing Page','landing')}
  <div class="card">
    <div class="eyebrow">Student Admission</div>
    <h2>Enter Student Information</h2>
    ${formError? `<div class="error-box">${esc(formError)}</div>`:''}
    <form onsubmit="return submitAdmission(event)">
      <label>Full Name</label>
      <input type="text" id="ad-name" required value="${esc(d.name||'')}">
      <label>Birthdate</label>
      <input type="date" id="ad-bdate" required value="${esc(d.bdate||'')}">
      <label>Address</label>
      <input type="text" id="ad-address" required value="${esc(d.address||'')}">
      <label>Contact Number</label>
      <input type="tel" id="ad-contact" required value="${esc(d.contact||'')}">
      <label>Email</label>
      <input type="email" id="ad-email" required value="${esc(d.email||'')}">
      <label>Guardian Name</label>
      <input type="text" id="ad-guardian" required value="${esc(d.guardian||'')}">
      <label>Intended Program</label>
      <select id="ad-program" required>
        <option value="">Select a program</option>
        ${['BS Information Technology','BS Computer Science','BS Business Administration','BS Education'].map(p=>`<option ${d.program===p?'selected':''}>${p}</option>`).join('')}
      </select>
      <div style="margin-top:18px;">
        <button class="btn gold" type="submit">Review &amp; Confirm</button>
      </div>
    </form>
  </div>
  `;
}
function submitAdmission(e){
  e.preventDefault();
  draft = {
    name: document.getElementById('ad-name').value.trim(),
    bdate: document.getElementById('ad-bdate').value,
    address: document.getElementById('ad-address').value.trim(),
    contact: document.getElementById('ad-contact').value.trim(),
    email: document.getElementById('ad-email').value.trim(),
    guardian: document.getElementById('ad-guardian').value.trim(),
    program: document.getElementById('ad-program').value
  };
  route = {page:'admission-confirm'};
  renderConfirmAdmission();
  return false;
}
function renderConfirmAdmission(){
  const app = document.getElementById('app');
  const d = draft;
  app.innerHTML = renderHeader() + `<main><div class="wrap">
    ${crumb('Edit Information','admission')}
    <div class="card accent">
      <div class="eyebrow">Confirm Information</div>
      <h2>Is this correct?</h2>
      <div class="divider"></div>
      <div class="slip" style="border-style:solid;">
        <div class="row"><span>Full Name</span><span>${esc(d.name)}</span></div>
        <div class="row"><span>Birthdate</span><span>${esc(d.bdate)}</span></div>
        <div class="row"><span>Address</span><span>${esc(d.address)}</span></div>
        <div class="row"><span>Contact</span><span>${esc(d.contact)}</span></div>
        <div class="row"><span>Email</span><span>${esc(d.email)}</span></div>
        <div class="row"><span>Guardian</span><span>${esc(d.guardian)}</span></div>
        <div class="row"><span>Program</span><span>${esc(d.program)}</span></div>
      </div>
      <div class="btn block-row">
        <button class="btn outline" onclick="nav('admission')">No, Edit</button>
        <button class="btn gold" onclick="confirmAdmissionYes()">Yes, Confirm</button>
      </div>
    </div>
  </div></main>`;
}
async function confirmAdmissionYes(){
  const ref = 'ADM-' + (db.nextAdmRef++);
  const record = Object.assign({ref, dateFiled:new Date().toISOString(), linked:false}, draft);
  db.admissions.push(record);
  await saveDB();
  draft = record;
  nav('admissionSlip');
}
function pageAdmissionSlip(){
  const d = draft;
  return `
  <div class="card">
    <div class="eyebrow">Application Received</div>
    <h2>Printable On-Site Admission Slip</h2>
    <p class="sub">Present this slip to the Registrar's Office to complete enrollment.</p>
  </div>
  <div class="slip" id="printSlip">
    <div class="stamp">RECEIVED</div>
    <div class="ref">${esc(d.ref)}</div>
    <h3>${esc(d.name)}</h3>
    <div class="row"><span>Program</span><span>${esc(d.program)}</span></div>
    <div class="row"><span>Birthdate</span><span>${esc(d.bdate)}</span></div>
    <div class="row"><span>Contact</span><span>${esc(d.contact)}</span></div>
    <div class="row"><span>Email</span><span>${esc(d.email)}</span></div>
    <div class="row"><span>Guardian</span><span>${esc(d.guardian)}</span></div>
    <div class="row"><span>Date Filed</span><span>${new Date(d.dateFiled).toLocaleString()}</span></div>
  </div>
  <button class="btn outline" onclick="window.print()">Print Slip</button>
  <button class="btn gold" onclick="nav('landing')">Return to Landing Page</button>
  `;
}

/* ===================== SHARED CONFIRM LOGOUT ===================== */
function pageConfirmLogout(who){
  return `
  ${crumb(who==='admin'?'Admin Dashboard':'Student Dashboard', who)}
  <div class="card">
    <div class="eyebrow">Log Out</div>
    <h2>Confirm Logout?</h2>
    <p class="sub">You'll need your username and password to sign back in.</p>
    <div class="btn block-row">
      <button class="btn outline" onclick="nav('${who}')">No, Stay</button>
      <button class="btn danger" onclick="doLogout()">Yes, Log Out</button>
    </div>
  </div>
  `;
}
function doLogout(){
  session = null;
  nav('loggedOut');
}
function pageLoggedOut(){
  return `
  <div class="card accent" style="text-align:center;">
    <div class="eyebrow">Session Ended</div>
    <h2>Log Out Success!</h2>
    <button class="btn gold" onclick="nav('landing')">Back to Landing Page</button>
  </div>
  `;
}

/* ===================== ADMIN HUB ===================== */
const adminTiles = [
  {key:'admin-studentReg', icon:'📝', t:'Student Registration', d:'Register walk-in students'},
  {key:'admin-subjects', icon:'📚', t:'Manage Subjects & Curriculum', d:'Units & prerequisites'},
  {key:'admin-payments', icon:'💳', t:'Payments & Billing', d:'Balances & history'},
  {key:'admin-reports', icon:'📊', t:'Reports', d:'Class lists & records'},
  {key:'admin-createAdmin', icon:'🛡️', t:'Create Admin Account', d:'Add registrar staff'},
  {key:'admin-createStudent', icon:'🎓', t:'Create Student Account', d:'Issue student login'},
  {key:'admin-enrollment', icon:'✅', t:'Enrollment Processing', d:'Approve or decline requests'},
  {key:'admin-logout', icon:'🚪', t:'Log Out', d:'End your session'}
];
function pageAdminHub(){
  if(!requireRole('admin')) return '';
  return `
  <div class="card accent">
    <div class="eyebrow">Admin Dashboard</div>
    <h2>Welcome, ${esc(session.displayName)}.</h2>
    <p class="sub">${db.students.length} students · ${db.enrollmentRequests.filter(r=>r.status==='pending').length} pending enrollment requests</p>
  </div>
  <div class="grid">
    ${adminTiles.map(m=>`<div class="tile" onclick="nav('${m.key}')"><span class="icon">${m.icon}</span><div class="t">${m.t}</div><div class="d">${m.d}</div></div>`).join('')}
  </div>
  `;
}
function backToAdmin(){ return `<div style="margin-top:16px;">${crumb('Admin Dashboard','admin')}</div>`; }

/* --- Student Registration --- */
function pageAdminStudentReg(){
  if(!requireRole('admin')) return '';
  const pending = db.admissions.filter(a=>!a.linked);
  return `
  ${crumb('Admin Dashboard','admin')}
  <div class="card">
    <div class="eyebrow">Student Registration</div>
    <h2>Pending On-Site Admissions</h2>
    <p class="sub">Validate submitted information, then register the student.</p>
    ${pending.length===0? '<p class="help">No pending admissions right now.</p>' :
      pending.map(a=>`
      <div class="divider"></div>
      <div class="row" style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:700;">${esc(a.name)}</div>
          <div class="help mono">${esc(a.ref)} · ${esc(a.program)}</div>
        </div>
        <button class="btn gold small" onclick="registerStudent('${esc(a.ref)}')">Register</button>
      </div>
      `).join('')
    }
  </div>

async function registerStudent(ref){

  if(!confirm(`Confirm information for ${a.name} is correct and register this student?`)) return;
  const studentId = 'STU-' + (db.nextStudentId++);
  db.students.push({
    studentId, name:a.name, email:a.email, contact:a.contact, program:a.program,
    subjects:[], balance:0, payments:[], hasAccount:false
  });

  alert('Student Registered!');

}

  await saveDB();
  render();

function pageAdminEnrollment(){
  if(!requireRole('admin')) return '';
  const pending = db.enrollmentRequests.filter(r=>r.status==='pending');
  return `
  ${crumb('Admin Dashboard','admin')}
  <div class="card">
    <div class="eyebrow">Enrollment Processing</div>
    <h2>Validate or Decline Requests</h2>
    ${pending.length===0? '<p class="help">No pending enrollment requests.</p>' :
      pending.map(r=>{
        const s = db.students.find(x=>x.studentId===r.studentId);
        return `<div class="divider"></div>
        <div style="font-weight:700;">${esc(s?s.name:r.studentId)}</div>
        <div class="help">${r.subjects.join(', ')}</div>
        <div class="btn block-row" style="margin-top:8px;">
          <button class="btn outline small" onclick="processEnrollment(${r.id},false)">Decline</button>
          <button class="btn gold small" onclick="processEnrollment(${r.id},true)">Accept</button>
        </div>`;
      }).join('')
    }
  </div>
  `;
}
async function processEnrollment(id, accept){
  const r = db.enrollmentRequests.find(x=>x.id===id);
  const s = db.students.find(x=>x.studentId===r.studentId);
  r.status = accept? 'approved':'declined';
  r.decidedDate = new Date().toISOString();
  if(accept && s){
    s.subjects = Array.from(new Set([...s.subjects, ...r.subjects]));
    const tuition = r.subjects.reduce((sum,code)=>{
      const sub = db.subjects.find(x=>x.code===code);
      return sum + (sub? sub.units*500 : 1500);
    },0);
    s.balance += tuition;
  }
  await saveDB();
  render();
}

async function submitEnrollment(e){
  e.preventDefault();
  const checked = Array.from(document.querySelectorAll('input[name=subj]:checked:not(:disabled)')).map(c=>c.value);
  if(checked.length===0){ alert('Please choose at least one subject.'); return false; }
  db.enrollmentRequests.push({id:db.nextReqId++, studentId:session.studentId, subjects:checked, status:'pending', dateSubmitted:new Date().toISOString()});
  await saveDB();
  alert('Enrollment form submitted — pending admin approval.');
  nav('student');
  return false;
}

async function submitPayment(){

  await saveDB();

  render();

  if(!session || session.role!==role){

    return false;

  return true;
}
